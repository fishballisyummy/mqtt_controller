<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Blaster</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      flex-direction: column;
    }
    canvas {
      border: 2px solid #333;
      background: #111;
    }
    #scoreBoard {
      margin-bottom: 10px;
      font-size: 18px;
    }
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      color: gold;
      text-align: center;
      display: none;
    }
    #restart {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 12px 24px;
      font-size: 18px;
      background: linear-gradient(45deg, #4ecdc4, #55efc4);
      color: #1a1a2e;
      border: none;
      cursor: pointer;
      display: none;
      margin-top: 10px;
      border-radius: 25px;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(78, 205, 196, 0.3);
    }
    
    #restart:hover {
      transform: translate(-50%, -52%);
      box-shadow: 0 6px 20px rgba(78, 205, 196, 0.5);
    }
    
    #restart:active {
      transform: translate(-50%, -50%);
    }
    
    .mobile-controls {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      gap: 20px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 20px;
      border: 2px solid #4ecdc4;
    }
    
    .control-arrow {
      width: 60px;
      height: 60px;
      background: linear-gradient(45deg, #4ecdc4, #55efc4);
      border: none;
      border-radius: 50%;
      color: #1a1a2e;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .control-arrow:active {
      transform: scale(0.9);
      background: linear-gradient(45deg, #55efc4, #4ecdc4);
    }
    
    @media (max-width: 768px) {
      .mobile-controls {
        display: flex;
      }
      
      canvas {
        max-width: 100%;
        height: auto;
      }
      
      body {
        padding: 10px;
      }
      
      #scoreBoard {
        font-size: 16px;
        margin-bottom: 15px;
      }
      
      #message {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div id="scoreBoard">分數: <span id="score">0</span>｜最高分: <span id="highScore">0</span></div>
  <canvas id="game" width="800" height="600"></canvas>
  <div id="message">遊戲結束！</div>
  <button id="restart">重置本局（保留紀錄）</button>
  
  <div class="mobile-controls">
    <button class="control-arrow" id="leftBtn">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button class="control-arrow" id="rightBtn">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>

  <script src="game_error_handler.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const messageEl = document.getElementById('message');
    const restartBtn = document.getElementById('restart');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');

    // 分數系統
    let score = 0;
    let highScore = localStorage.getItem('blockBlasterHighScore') || 0;
    highScore = parseInt(highScore);
    highScoreEl.textContent = highScore;

    // 球拍
    const paddle = {
      width: 100,
      height: 15,
      x: canvas.width / 2 - 50,
      y: canvas.height - 30,
      speed: 10
    };

    // 球
    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 50,
      radius: 10,
      dx: 4 * (Math.random() > 0.5 ? 1 : -1),
      dy: -4,
      speed: 4
    };

    // 磚塊設定
    const brickRowCount = 5;
    const brickColumnCount = 12;
    const brickWidth = 60;
    const brickHeight = 20;
    const brickPadding = 5;
    const brickOffsetTop = 60;
    const brickOffsetLeft = 35;

    // 產生磚塊
    let bricks = [];
    for (let r = 0; r < brickRowCount; r++) {
      bricks[r] = [];
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[r][c] = { status: true };
      }
    }

    let gameOver = false;
    let gameWon = false;

    // Enhanced input controls
    let mousePos = { x: canvas.width / 2 };
    let touchActive = false;
    
    // Mouse controls
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mousePos.x = e.clientX - rect.left;
    });
    
    canvas.addEventListener('mouseleave', () => {
      // Reset position when mouse leaves canvas
      mousePos.x = canvas.width / 2;
    });
    
    // Enhanced touch controls
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      touchActive = true;
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      mousePos.x = touch.clientX - rect.left;
    }, { passive: false });
    
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!touchActive) return;
      
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      mousePos.x = touch.clientX - rect.left;
    }, { passive: false });
    
    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      touchActive = false;
    }, { passive: false });
    
    // Keyboard controls as fallback
    document.addEventListener('keydown', (e) => {
      const moveSpeed = 20;
      switch(e.key) {
        case 'ArrowLeft':
        case 'a':
        case 'A':
          mousePos.x = Math.max(0, mousePos.x - moveSpeed);
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          mousePos.x = Math.min(canvas.width, mousePos.x + moveSpeed);
          break;
      }
    });
    
    // Prevent scrolling on mobile when touching the game
    document.body.addEventListener('touchmove', (e) => {
      if (e.target === canvas) {
        e.preventDefault();
      }
    }, { passive: false });

    // 分數更新函式
    function updateScore(points) {
      score += points;
      scoreEl.textContent = score;
      if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
        localStorage.setItem('blockBlasterHighScore', highScore);
      }
    }

    // 繪製所有元素（略，與原碼相同）
    function drawPaddle() {
      ctx.fillStyle = '#00FF00';
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
      ctx.strokeStyle = '#00AA00';
      ctx.strokeRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }
    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.closePath();
    }
    function drawBricks() {
      for (let r = 0; r < brickRowCount; r++) {
        for (let c = 0; c < brickColumnCount; c++) {
          if (bricks[r][c].status) {
            const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
            const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
            bricks[r][c].x = brickX;
            bricks[r][c].y = brickY;

            const hue = (r * 60) % 360;
            ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
            ctx.fillRect(brickX, brickY, brickWidth, brickHeight);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(brickX, brickY, brickWidth, brickHeight);
          }
        }
      }
    }

    // 碰撞檢測（新增得分）
    function collisionDetection() {
      for (let r = 0; r < brickRowCount; r++) {
        for (let c = 0; c < brickColumnCount; c++) {
          const brick = bricks[r][c];
          if (brick.status) {
            if (
              ball.x + ball.radius > brick.x &&
              ball.x - ball.radius < brick.x + brickWidth &&
              ball.y + ball.radius > brick.y &&
              ball.y - ball.radius < brick.y + brickHeight
            ) {
              ball.dy = -ball.dy;
              brick.status = false;
              updateScore(10); // 擊破磚塊 +10 分

              if (allBricksDestroyed()) {
                gameWon = true;
                showMessage('你贏了！🎉');
              }
            }
          }
        }
      }
    }

    function allBricksDestroyed() {
      for (let r = 0; r < brickRowCount; r++) {
        for (let c = 0; c < brickColumnCount; c++) {
          if (bricks[r][c].status) return false;
        }
      }
      return true;
    }

    function update() {
      if (gameOver || gameWon) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      paddle.x = mousePos.x - paddle.width / 2;
      if (paddle.x < 0) paddle.x = 0;
      if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;

      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) ball.dx = -ball.dx;
      if (ball.y - ball.radius < 0) ball.dy = -ball.dy;

      if (ball.y + ball.radius > canvas.height) {
        if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
          const hitPos = (ball.x - paddle.x) / paddle.width;
          const angle = hitPos * Math.PI - Math.PI / 2;
          ball.dx = ball.speed * Math.cos(angle);
          ball.dy = -ball.speed * Math.sin(angle);
        } else {
          gameOver = true;
          showMessage('遊戲結束！');
        }
      }

      collisionDetection();
      drawBricks();
      drawPaddle();
      drawBall();
      requestAnimationFrame(update);
    }

    function showMessage(text) {
      messageEl.textContent = text;
      messageEl.style.display = 'block';
      restartBtn.style.display = 'block';
    }

    function resetGame() {
      // 重置當前分數，但保留 highScore
      score = 0;
      scoreEl.textContent = score;

      // 重置球、球拍、磚塊
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 50;
      ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
      ball.dy = -4;
      paddle.x = canvas.width / 2 - paddle.width / 2;

      for (let r = 0; r < brickRowCount; r++) {
        for (let c = 0; c < brickColumnCount; c++) {
          bricks[r][c].status = true;
        }
      }

      gameOver = false;
      gameWon = false;
      messageEl.style.display = 'none';
      restartBtn.style.display = 'none';

      update();
    }

restartBtn.addEventListener('click', resetGame);
    
    // Mobile control buttons
    const leftBtn = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');
    
    if (leftBtn && rightBtn) {
      let leftInterval = null;
      let rightInterval = null;
      
      const moveLeft = () => {
        mousePos.x = Math.max(paddle.width / 2, mousePos.x - 15);
      };
      
      const moveRight = () => {
        mousePos.x = Math.min(canvas.width - paddle.width / 2, mousePos.x + 15);
      };
      
      leftBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        moveLeft();
        leftInterval = setInterval(moveLeft, 50);
      });
      
      leftBtn.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (leftInterval) {
          clearInterval(leftInterval);
          leftInterval = null;
        }
      });
      
      rightBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        moveRight();
        rightInterval = setInterval(moveRight, 50);
      });
      
      rightBtn.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (rightInterval) {
          clearInterval(rightInterval);
          rightInterval = null;
        }
      });
      
      // Mouse fallback for desktop testing
      leftBtn.addEventListener('mousedown', () => {
        moveLeft();
        leftInterval = setInterval(moveLeft, 50);
      });
      
      leftBtn.addEventListener('mouseup', () => {
        if (leftInterval) {
          clearInterval(leftInterval);
          leftInterval = null;
        }
      });
      
      rightBtn.addEventListener('mousedown', () => {
        moveRight();
        rightInterval = setInterval(moveRight, 50);
      });
      
      rightBtn.addEventListener('mouseup', () => {
        if (rightInterval) {
          clearInterval(rightInterval);
          rightInterval = null;
        }
      });
    }
    
    update();
  </script>
</body>
</html>
