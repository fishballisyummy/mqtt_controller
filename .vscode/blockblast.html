<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Blaster</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      flex-direction: column;
    }
    canvas {
      border: 2px solid #333;
      background: #111;
    }
    #scoreBoard {
      margin-bottom: 10px;
      font-size: 18px;
    }
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      color: gold;
      text-align: center;
      display: none;
    }
    #restart {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 20px;
      font-size: 18px;
      background: lime;
      color: black;
      border: none;
      cursor: pointer;
      display: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="scoreBoard">分數: <span id="score">0</span>｜最高分: <span id="highScore">0</span></div>
  <canvas id="game" width="800" height="600"></canvas>
  <div id="message">遊戲結束！</div>
  <button id="restart">重置本局（保留紀錄）</button>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const messageEl = document.getElementById('message');
    const restartBtn = document.getElementById('restart');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');

    // 分數系統
    let score = 0;
    let highScore = localStorage.getItem('blockBlasterHighScore') || 0;
    highScore = parseInt(highScore);
    highScoreEl.textContent = highScore;

    // 球拍
    const paddle = {
      width: 100,
      height: 15,
      x: canvas.width / 2 - 50,
      y: canvas.height - 30,
      speed: 10
    };

    // 球
    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 50,
      radius: 10,
      dx: 4 * (Math.random() > 0.5 ? 1 : -1),
      dy: -4,
      speed: 4
    };

    // 磚塊設定
    const brickRowCount = 5;
    const brickColumnCount = 12;
    const brickWidth = 60;
    const brickHeight = 20;
    const brickPadding = 5;
    const brickOffsetTop = 60;
    const brickOffsetLeft = 35;

    // 產生磚塊
    let bricks = [];
    for (let r = 0; r < brickRowCount; r++) {
      bricks[r] = [];
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[r][c] = { status: true };
      }
    }

    let gameOver = false;
    let gameWon = false;

    // 滑鼠控制
    let mousePos = { x: 0 };
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mousePos.x = e.clientX - rect.left;
    });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      mousePos.x = e.touches[0].clientX - rect.left;
    }, { passive: false });

    // 分數更新函式
    function updateScore(points) {
      score += points;
      scoreEl.textContent = score;
      if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
        localStorage.setItem('blockBlasterHighScore', highScore);
      }
    }

    // 繪製所有元素（略，與原碼相同）
    function drawPaddle() {
      ctx.fillStyle = '#00FF00';
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
      ctx.strokeStyle = '#00AA00';
      ctx.strokeRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }
    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.closePath();
    }
    function drawBricks() {
      for (let r = 0; r < brickRowCount; r++) {
        for (let c = 0; c < brickColumnCount; c++) {
          if (bricks[r][c].status) {
            const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
            const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
            bricks[r][c].x = brickX;
            bricks[r][c].y = brickY;

            const hue = (r * 60) % 360;
            ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
            ctx.fillRect(brickX, brickY, brickWidth, brickHeight);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(brickX, brickY, brickWidth, brickHeight);
          }
        }
      }
    }

    // 碰撞檢測（新增得分）
    function collisionDetection() {
      for (let r = 0; r < brickRowCount; r++) {
        for (let c = 0; c < brickColumnCount; c++) {
          const brick = bricks[r][c];
          if (brick.status) {
            if (
              ball.x + ball.radius > brick.x &&
              ball.x - ball.radius < brick.x + brickWidth &&
              ball.y + ball.radius > brick.y &&
              ball.y - ball.radius < brick.y + brickHeight
            ) {
              ball.dy = -ball.dy;
              brick.status = false;
              updateScore(10); // 擊破磚塊 +10 分

              if (allBricksDestroyed()) {
                gameWon = true;
                showMessage('你贏了！🎉');
              }
            }
          }
        }
      }
    }

    function allBricksDestroyed() {
      for (let r = 0; r < brickRowCount; r++) {
        for (let c = 0; c < brickColumnCount; c++) {
          if (bricks[r][c].status) return false;
        }
      }
      return true;
    }

    function update() {
      if (gameOver || gameWon) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      paddle.x = mousePos.x - paddle.width / 2;
      if (paddle.x < 0) paddle.x = 0;
      if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;

      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) ball.dx = -ball.dx;
      if (ball.y - ball.radius < 0) ball.dy = -ball.dy;

      if (ball.y + ball.radius > canvas.height) {
        if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
          const hitPos = (ball.x - paddle.x) / paddle.width;
          const angle = hitPos * Math.PI - Math.PI / 2;
          ball.dx = ball.speed * Math.cos(angle);
          ball.dy = -ball.speed * Math.sin(angle);
        } else {
          gameOver = true;
          showMessage('遊戲結束！');
        }
      }

      collisionDetection();
      drawBricks();
      drawPaddle();
      drawBall();
      requestAnimationFrame(update);
    }

    function showMessage(text) {
      messageEl.textContent = text;
      messageEl.style.display = 'block';
      restartBtn.style.display = 'block';
    }

    function resetGame() {
      // 重置當前分數，但保留 highScore
      score = 0;
      scoreEl.textContent = score;

      // 重置球、球拍、磚塊
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 50;
      ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
      ball.dy = -4;
      paddle.x = canvas.width / 2 - paddle.width / 2;

      for (let r = 0; r < brickRowCount; r++) {
        for (let c = 0; c < brickColumnCount; c++) {
          bricks[r][c].status = true;
        }
      }

      gameOver = false;
      gameWon = false;
      messageEl.style.display = 'none';
      restartBtn.style.display = 'none';

      update();
    }

    restartBtn.addEventListener('click', resetGame);
    update();
  </script>
</body>
</html>
