<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機器視覺剪刀石頭布 - 重構版</title>
    
    <!-- CSS with better error handling and fallbacks -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        
        header {
            text-align: center;
            padding: 25px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 2px solid #ff6b6b;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ff9a9e, #fad0c4, #fad0c4, #a1c4fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .game-area {
            display: flex;
            flex-wrap: wrap;
            padding: 25px;
            gap: 25px;
        }
        
        .camera-section {
            flex: 1;
            min-width: 300px;
            background: rgba(20, 20, 30, 0.8);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }
        
        .camera-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #4ecdc4;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 75%;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #000;
            border: 2px solid #4ecdc4;
        }
        
        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .gesture-display {
            width: 100%;
            text-align: center;
            padding: 15px;
            background: rgba(30, 30, 40, 0.8);
            border-radius: 10px;
            margin-top: 10px;
            font-size: 1.2rem;
        }
        
        .game-section {
            flex: 1;
            min-width: 300px;
            background: rgba(20, 20, 30, 0.8);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }
        
        .game-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ff6b6b;
        }
        
        .choices {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin: 20px 0;
        }
        
        .choice {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(50, 50, 60, 0.8);
            border: 2px solid #ff9a9e;
        }
        
        .choice i {
            font-size: 2.5rem;
        }
        
        .rock { color: #ffd166; }
        .paper { color: #06d6a0; }
        .scissors { color: #118ab2; }
        
        .result-section {
            width: 100%;
            text-align: center;
            margin: 20px 0;
        }
        
        .result-text {
            font-size: 1.8rem;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: rgba(30, 30, 40, 0.8);
            border-radius: 10px;
            margin: 15px 0;
        }
        
        .win { color: #06d6a0; }
        .lose { color: #ef476f; }
        .draw { color: #ffd166; }
        
        .scores {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin: 20px 0;
        }
        
        .score-box {
            background: rgba(30, 30, 40, 0.8);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            min-width: 120px;
        }
        
        .score-title {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #a1c4fd;
        }
        
        .score-value {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .player-score { color: #4ecdc4; }
        .computer-score { color: #ff6b6b; }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            color: #1a1a2e;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        #startBtn {
            background: linear-gradient(to right, #4ecdc4, #55efc4);
            color: #1a1a2e;
        }
        
        #resetBtn {
            background: linear-gradient(to right, #a1c4fd, #c2e9fb);
            color: #1a1a2e;
        }
        
        .countdown {
            font-size: 3rem;
            font-weight: bold;
            color: #ff6b6b;
            margin: 15px 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .instructions {
            padding: 25px;
            background: rgba(0, 0, 0, 0.4);
            border-top: 2px solid #4ecdc4;
        }
        
        .instructions h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #ffd166;
        }
        
        .instructions ul {
            padding-left: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .instructions li {
            margin: 10px 0;
            line-height: 1.5;
        }
        
        .gesture-icons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }
        
        .gesture-icon {
            text-align: center;
        }
        
        .gesture-icon i {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
        
        .rock-icon { color: #ffd166; }
        .paper-icon { color: #06d6a0; }
        .scissors-icon { color: #118ab2; }
        
        .error-message {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .game-area {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .choices {
                flex-wrap: wrap;
                gap: 15px;
            }
            
            .choice {
                width: 70px;
                height: 70px;
            }
        }
    </style>
    
    <!-- Font Awesome with fallback -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
          onerror="document.documentElement.style.setProperty('--fa-fallback', 'block')">
</head>
<body>
    <div class="container">
        <header>
            <h1>機器視覺剪刀石頭布 - 重構版</h1>
            <p class="subtitle">使用模組化架構，支援自動手勢識別與手動備用模式</p>
        </header>
        
        <div class="game-area">
            <div class="camera-section">
                <h2 class="camera-title">您的手勢</h2>
                <div class="video-container">
                    <video id="video" autoplay playsinline></video>
                </div>
                <div class="gesture-display">
                    <span id="detectedGesture">請啟動攝像頭</span>
                </div>
                <div class="countdown" id="countdown"></div>
                <button id="startBtn">開始遊戲</button>
            </div>
            
            <div class="game-section">
                <h2 class="game-title">電腦的選擇</h2>
                <div class="choices">
                    <div class="choice rock" id="computerRock">
                        <i class="fas fa-hand-rock"></i>
                    </div>
                    <div class="choice paper" id="computerPaper">
                        <i class="fas fa-hand-paper"></i>
                    </div>
                    <div class="choice scissors" id="computerScissors">
                        <i class="fas fa-hand-scissors"></i>
                    </div>
                </div>
                
                <div class="result-section">
                    <div class="result-text" id="resultText">準備開始遊戲...</div>
                </div>
                
                <div class="scores">
                    <div class="score-box">
                        <div class="score-title">玩家分數</div>
                        <div class="score-value player-score" id="playerScore">0</div>
                    </div>
                    <div class="score-box">
                        <div class="score-title">電腦分數</div>
                        <div class="score-value computer-score" id="computerScore">0</div>
                    </div>
                </div>
                
                <div class="controls">
                    <button id="resetBtn">重置遊戲</button>
                </div>
            </div>
        </div>
        
        <div class="instructions">
            <h2>如何遊玩</h2>
            <ul>
                <li>點擊「開始遊戲」按鈕啟動AI手勢識別</li>
                <li>等待3秒倒數結束後，系統會開始檢測您的手勢</li>
                <li>在攝像頭前做出以下手勢：</li>
                <div class="gesture-icons">
                    <div class="gesture-icon">
                        <i class="fas fa-hand-rock rock-icon"></i>
                        <div>石頭</div>
                    </div>
                    <div class="gesture-icon">
                        <i class="fas fa-hand-paper paper-icon"></i>
                        <div>布</div>
                    </div>
                    <div class="gesture-icon">
                        <i class="fas fa-hand-scissors scissors-icon"></i>
                        <div>剪刀</div>
                    </div>
                </div>
                <li>如果手勢識別失敗，系統會自動切換到手動模式</li>
                <li>每局結束後，點擊「開始遊戲」按鈕開始新一輪</li>
            </ul>
        </div>
    </div>

    <!-- Scripts with better error handling -->
    <script src="game_error_handler.js"></script>
    <script>
        // Global error handler
        window.addEventListener('error', function(e) {
            console.error('Global error:', e.error);
            const detectedGesture = document.getElementById('detectedGesture');
            if (detectedGesture) {
                detectedGesture.textContent = '發生錯誤，請重新整理頁面';
            }
        });

        // Script loader with timeout and fallback
        function loadScript(src, timeout = 5000) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = () => reject(new Error(`Failed to load ${src}`));
                
                // Add timeout
                const timeoutId = setTimeout(() => {
                    reject(new Error(`Timeout loading ${src}`));
                }, timeout);
                
                script.addEventListener('load', () => clearTimeout(timeoutId));
                
                document.head.appendChild(script);
            });
        }

        // Load MediaPipe with error handling
        async function loadMediaPipe() {
            try {
                await Promise.all([
                    loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js'),
                    loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js'),
                    loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js'),
                    loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js', 8000) // Longer timeout for pose
                ]);
                console.log('MediaPipe loaded successfully');
                return true;
            } catch (error) {
                console.warn('MediaPipe loading failed:', error);
                return false;
            }
        }

        // Initialize application
        async function initializeApp() {
            try {
                // Try to load MediaPipe, but continue even if it fails
                const mediaPipeLoaded = await loadMediaPipe();
                
                if (!mediaPipeLoaded) {
                    console.log('Running in fallback mode without MediaPipe');
                    // Set a global flag for fallback mode
                    window.MEDIAPIPE_AVAILABLE = false;
                } else {
                    window.MEDIAPIPE_AVAILABLE = true;
                }

                // Load the main game modules
                await loadScript('game2_modules.js');
                
                console.log('Application initialized successfully');
                
            } catch (error) {
                console.error('App initialization failed:', error);
                
                // Show a fallback message
                const detectedGesture = document.getElementById('detectedGesture');
                if (detectedGesture) {
                    detectedGesture.innerHTML = `
                        <div class="error-message">
                            無法載入完整功能，但您仍可使用手動模式<br>
                            請點擊「開始遊戲」繼續
                        </div>
                    `;
                }
                
                // Create a minimal fallback game
                createFallbackGame();
            }
        }

        // Create a minimal fallback game if everything else fails
        function createFallbackGame() {
            const cameraSection = document.querySelector('.camera-section');
            if (cameraSection) {
                const fallbackHTML = `
                    <div class="fallback-controls">
                        <h3>手動選擇模式</h3>
                        <div class="manual-choices">
                            <button class="manual-choice rock" onclick="playFallbackChoice('rock')">
                                石頭
                            </button>
                            <button class="manual-choice paper" onclick="playFallbackChoice('paper')">
                                布
                            </button>
                            <button class="manual-choice scissors" onclick="playFallbackChoice('scissors')">
                                剪刀
                            </button>
                        </div>
                    </div>
                `;
                
                // Replace video container with fallback controls
                const videoContainer = cameraSection.querySelector('.video-container');
                if (videoContainer) {
                    videoContainer.style.display = 'none';
                }
                
                cameraSection.insertAdjacentHTML('beforeend', fallbackHTML);
            }
        }

        // Fallback choice handler
        window.playFallbackChoice = function(gesture) {
            const choices = ['rock', 'paper', 'scissors'];
            const computerChoice = choices[Math.floor(Math.random() * choices.length)];
            
            const resultText = document.getElementById('resultText');
            const computerScore = document.getElementById('computerScore');
            const playerScore = document.getElementById('playerScore');
            
            let result;
            let playerScoreChange = 0;
            let computerScoreChange = 0;
            
            if (gesture === computerChoice) {
                result = '平局';
            } else if (
                (gesture === 'rock' && computerChoice === 'scissors') ||
                (gesture === 'paper' && computerChoice === 'rock') ||
                (gesture === 'scissors' && computerChoice === 'paper')
            ) {
                result = '您贏了!';
                playerScoreChange = 1;
            } else {
                result = '電腦贏了!';
                computerScoreChange = 1;
            }
            
            const gestureNames = { rock: '石頭', paper: '布', scissors: '剪刀' };
            
            if (resultText) {
                resultText.textContent = `${gestureNames[gesture]} vs ${gestureNames[computerChoice]} - ${result}`;
                resultText.className = `result-text ${result.includes('贏') ? 'win' : result.includes('輸') ? 'lose' : 'draw'}`;
            }
            
            if (playerScore && playerScoreChange) {
                playerScore.textContent = parseInt(playerScore.textContent) + playerScoreChange;
            }
            if (computerScore && computerScoreChange) {
                computerScore.textContent = parseInt(computerScore.textContent) + computerScoreChange;
            }
        };

        // Start the application
        initializeApp();
    </script>
</body>
</html>
