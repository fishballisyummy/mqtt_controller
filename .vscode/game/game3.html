<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>風洞模擬器 - 3D 粒子場景</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .simulation-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #0a1929;
            border-right: 2px solid #4ecdc4;
        }
        
        #webglCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .controls-panel {
            width: 300px;
            background: rgba(15, 32, 39, 0.95);
            padding: 20px;
            overflow-y: auto;
            border-left: 2px solid #ff6b6b;
        }
        
        .panel-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #4ecdc4;
            text-align: center;
            text-shadow: 0 0 10px rgba(78, 205, 196, 0.5);
        }
        
        .control-group {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #2c5364;
        }
        
        .control-group h3 {
            margin-bottom: 15px;
            color: #ffd166;
            font-size: 1.2rem;
        }
        
        .slider-container {
            margin: 10px 0;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        
        .slider {
            width: 100%;
            height: 8px;
            background: #2c3e50;
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #4ecdc4;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.8);
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        
        .btn-upload {
            background: linear-gradient(45deg, #4ecdc4, #55efc4);
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #ffd166, #ffea8a);
            color: #1a1a2e;
        }
        
        .status-info {
            background: rgba(44, 62, 80, 0.7);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
        
        .upload-info {
            text-align: center;
            padding: 15px;
            background: rgba(44, 62, 80, 0.5);
            border-radius: 8px;
            margin: 15px 0;
            font-size: 0.9rem;
            color: #a1c4fd;
        }
        
        .instructions {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 107, 107, 0.2);
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        
        .instructions h4 {
            color: #ff6b6b;
            margin-bottom: 8px;
        }

        /* 警告橫幅 */
        .warning-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #ff6b6b;
            color: white;
            text-align: center;
            padding: 8px;
            font-weight: bold;
            z-index: 1000;
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .controls-panel {
                width: 100%;
                height: 300px;
                border-left: none;
                border-top: 2px solid #ff6b6b;
            }
        }
    </style>
</head>
<body>
    <!-- 安全警告橫幅 -->
    <div class="warning-banner" id="warningBanner">
        ⚠️ 請勿直接雙擊開啟！請用 Live Server 或 http-server 啟動本頁面以支援檔案上傳。
    </div>

    <div class="container">
        <div class="simulation-area">
            <canvas id="webglCanvas"></canvas>
        </div>
        
        <div class="controls-panel">
            <h2 class="panel-title">風洞模擬控制台</h2>
            
            <div class="upload-info">
                📁 支援格式: .glTF, .glb, .OBJ, .STL<br>
                (Three.js 真實 3D 渲染)
            </div>

            <!-- 隱藏的檔案輸入（關鍵！） -->
            <input type="file" id="modelFileInput" accept=".gltf,.glb,.obj,.stl" style="display:none" />

            <div class="control-group">
                <h3>風洞參數</h3>
                <div class="slider-container">
                    <div class="slider-label">
                        <span>風速</span>
                        <span id="windSpeedValue">50 km/h</span>
                    </div>
                    <input type="range" min="0" max="200" value="50" class="slider" id="windSpeed">
                </div>
                
                <div class="slider-container">
                    <div class="slider-label">
                        <span>粒子密度</span>
                        <span id="particleDensityValue">100</span>
                    </div>
                    <input type="range" min="10" max="300" value="100" class="slider" id="particleDensity">
                </div>
                
                <div class="slider-container">
                    <div class="slider-label">
                        <span>湍流強度</span>
                        <span id="turbulenceValue">30%</span>
                    </div>
                    <input type="range" min="0" max="100" value="30" class="slider" id="turbulence">
                </div>
            </div>
            
            <div class="control-group">
                <h3>模型控制</h3>
                <div class="slider-container">
                    <div class="slider-label">
                        <span>X 軸旋轉</span>
                        <span id="rotationXValue">0°</span>
                    </div>
                    <input type="range" min="-180" max="180" value="0" class="slider" id="rotationX">
                </div>
                
                <div class="slider-container">
                    <div class="slider-label">
                        <span>Y 軸旋轉</span>
                        <span id="rotationYValue">0°</span>
                    </div>
                    <input type="range" min="-180" max="180" value="0" class="slider" id="rotationY">
                </div>
                
                <div class="slider-container">
                    <div class="slider-label">
                        <span>Z 軸旋轉</span>
                        <span id="rotationZValue">0°</span>
                    </div>
                    <input type="range" min="-180" max="180" value="0" class="slider" id="rotationZ">
                </div>
                
                <button class="btn btn-upload" id="uploadBtn">
                    📤 上傳 3D 模型
                </button>
            </div>
            
            <button class="btn btn-primary" id="startBtn">
                ▶ 開始模擬
            </button>
            <button class="btn" id="pauseBtn">
                ⏸ 暫停模擬
            </button>
            <button class="btn" id="resetBtn">
                🔄 重置模擬
            </button>
            
            <div class="status-info">
                <div class="status-row">
                    <span>狀態:</span>
                    <span id="simulationStatus">已暫停</span>
                </div>
                <div class="status-row">
                    <span>粒子數:</span>
                    <span id="particleCount">0</span>
                </div>
                <div class="status-row">
                    <span>幀率:</span>
                    <span id="fps">0 FPS</span>
                </div>
            </div>
            
            <div class="instructions">
                <h4>ℹ️ 使用說明</h4>
                <p>• 調整風速觀察粒子流動變化<br>
                • 三軸旋轉控制模型角度<br>
                • 真實 Three.js 3D 渲染<br>
                • 粒子系統模擬氣流</p>
            </div>
        </div>
    </div>

    <!-- 引入 Three.js 及必要模組（帶完整性驗證和安全檢查） -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js" 
            integrity="sha384-LV/T1CnWLZ8w4L7P7rJzBVqCUQHQH16IItT1EaBVjQdTKwXvW4yZVQZ2WQJhXUFc" 
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.min.js"
            integrity="sha384-7rzYV8W8I0tf5HwF3XqYhQ1L5QvhYCkzF5HhgEDRVgZgD1WQjBBjPVjYZQOU9Nf" 
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/GLTFLoader.js"
            integrity="sha384-4r7J6J9D8lP7GXQV8zQZVK8Gd5o1jVZFNkd8Q3ZtQ1cU8j9r3G2fQCGp8X5Qd" 
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/OBJLoader.js"
            integrity="sha384-u5L8PqG8zJQZsFjL9YQ2MX5V0A+QrH+jQKd9kKmFjGq0Q3hC4x6F3Q0zLx7Gf9U" 
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/STLLoader.js"
            integrity="sha384-7v5C8lA5QJNqLdK1fE9L8pQG2Eg7t9T7Kj6dF5E9Q8SfQq1bF8P7M3M4N0Vd" 
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/utils/BufferGeometryUtils.js"
            integrity="sha384-ZK9m6nRN1qNWWZqNqE+Sg0g2nH6GzgGZJ2P9nF5R7R9W1pYXN1j1uQPh9N3mQ8" 
            crossorigin="anonymous"></script>
    
    <!-- Security and Error Handling -->
    <script>
        // Security checks and fallback loader
        window.ThreeJSSecurity = {
            checkLibraries: function() {
                const requiredLibraries = ['THREE', 'THREE.GLTFLoader', 'THREE.OBJLoader', 'THREE.STLLoader'];
                const missingLibraries = [];
                
                requiredLibraries.forEach(lib => {
                    if (!this.checkLibraryExists(lib)) {
                        missingLibraries.push(lib);
                    }
                });
                
                if (missingLibraries.length > 0) {
                    console.error('Missing Three.js libraries:', missingLibraries);
                    this.loadFallbackLibraries(missingLibraries);
                    return false;
                }
                
                return true;
            },
            
            checkLibraryExists: function(libPath) {
                const parts = libPath.split('.');
                let current = window;
                
                for (let part of parts) {
                    if (current[part] === undefined) {
                        return false;
                    }
                    current = current[part];
                }
                
                return true;
            },
            
            loadFallbackLibraries: function(missingLibraries) {
                console.log('Loading fallback libraries...');
                const fallbackSources = {
                    'THREE': 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
                    'THREE.GLTFLoader': 'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/GLTFLoader.js',
                    'THREE.OBJLoader': 'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/OBJLoader.js',
                    'THREE.STLLoader': 'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/STLLoader.js'
                };
                
                missingLibraries.forEach(lib => {
                    if (fallbackSources[lib]) {
                        const script = document.createElement('script');
                        script.src = fallbackSources[lib];
                        script.onerror = () => console.error(`Failed to load fallback library: ${lib}`);
                        document.head.appendChild(script);
                    }
                });
            },
            
            validateContext: function() {
                // Check WebGL support
                if (!window.WebGLRenderingContext) {
                    console.error('WebGL not supported');
                    return false;
                }
                
                // Check for necessary APIs
                const requiredAPIs = ['File', 'FileReader', 'URL', 'Blob'];
                const missingAPIs = requiredAPIs.filter(api => !window[api]);
                
                if (missingAPIs.length > 0) {
                    console.error('Missing required APIs:', missingAPIs);
                    return false;
                }
                
                return true;
            }
        };
        
        // Validate Three.js libraries on load
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                ThreeJSSecurity.checkLibraries();
                ThreeJSSecurity.validateContext();
            }, 1000);
        });
    </script>

    <script>
        // === 安全檢查：是否使用 file:// ===
        if (window.location.protocol === 'file:') {
            document.getElementById('warningBanner').style.display = 'block';
            alert('⚠️ 請勿直接雙擊開啟 HTML！\n\n請使用 Live Server、http-server 或其他本機伺服器啟動本頁面，否則無法上傳模型。');
        }

        // === Three.js 變量 ===
        let scene, camera, renderer, controls;
        let model = null;
        let particles = [];
        let simulationRunning = false;
        let animationId = null;
        let lastTime = 0;
        let frameCount = 0;
        let fps = 0;
        
        // === Configuration Object ===
        const CONFIG = {
            PARTICLE_CONFIG: {
                baseSpeed: 0.05,
                baseSize: 0.1,
                maxParticles: 300,
                minParticles: 10
            },
            CAMERA_CONFIG: {
                initialPosition: { x: 0, y: 5, z: 25 },
                fov: 75,
                near: 0.1,
                far: 1000
            },
            SCENE_CONFIG: {
                backgroundColor: 0x0a1929,
                fogColor: 0x0a1929,
                fogNear: 20,
                fogFar: 100
            }
        };

        // === DOM 元素 ===
        const windSpeedSlider = document.getElementById('windSpeed');
        const particleDensitySlider = document.getElementById('particleDensity');
        const turbulenceSlider = document.getElementById('turbulence');
        const rotationXSlider = document.getElementById('rotationX');
        const rotationYSlider = document.getElementById('rotationY');
        const rotationZSlider = document.getElementById('rotationZ');
        const uploadBtn = document.getElementById('uploadBtn');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const fileInput = document.getElementById('modelFileInput');

        const windSpeedValue = document.getElementById('windSpeedValue');
        const particleDensityValue = document.getElementById('particleDensityValue');
        const turbulenceValue = document.getElementById('turbulenceValue');
        const rotationXValue = document.getElementById('rotationXValue');
        const rotationYValue = document.getElementById('rotationYValue');
        const rotationZValue = document.getElementById('rotationZValue');
        const simulationStatus = document.getElementById('simulationStatus');
        const particleCountEl = document.getElementById('particleCount');
        const fpsEl = document.getElementById('fps');

// === Three.js Manager Class ===
        class ThreeJSManager {
            constructor(config) {
                this.config = config;
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.controls = null;
                this.modelManager = null;
                this.particleSystem = null;
                this.fileLoader = null;
            }

            initialize() {
                this.createScene();
                this.createCamera();
                this.createRenderer();
                this.createControls();
                this.createLighting();
                this.createManagers();
                this.setupEventListeners();
                
                return {
                    scene: this.scene,
                    camera: this.camera,
                    renderer: this.renderer,
                    controls: this.controls,
                    modelManager: this.modelManager,
                    particleSystem: this.particleSystem,
                    fileLoader: this.fileLoader
                };
            }

            createScene() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(this.config.SCENE_CONFIG.backgroundColor);
                this.scene.fog = new THREE.Fog(
                    this.config.SCENE_CONFIG.fogColor, 
                    this.config.SCENE_CONFIG.fogNear, 
                    this.config.SCENE_CONFIG.fogFar
                );
            }

            createCamera() {
                const canvas = document.getElementById('webglCanvas');
                const aspect = canvas.parentElement.clientWidth / canvas.parentElement.clientHeight;
                
                this.camera = new THREE.PerspectiveCamera(
                    this.config.CAMERA_CONFIG.fov,
                    aspect,
                    this.config.CAMERA_CONFIG.near,
                    this.config.CAMERA_CONFIG.far
                );
                
                this.camera.position.set(
                    this.config.CAMERA_CONFIG.initialPosition.x,
                    this.config.CAMERA_CONFIG.initialPosition.y,
                    this.config.CAMERA_CONFIG.initialPosition.z
                );
            }

            createRenderer() {
                const canvas = document.getElementById('webglCanvas');
                this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
                this.renderer.setSize(canvas.parentElement.clientWidth, canvas.parentElement.clientHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
            }

            createControls() {
                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
            }

            createLighting() {
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0x4ecdc4, 1);
                directionalLight.position.set(10, 20, 15);
                directionalLight.castShadow = true;
                this.scene.add(directionalLight);
            }

            createManagers() {
                this.modelManager = new ModelManager(this.scene);
                this.particleSystem = new ParticleSystem(this.scene, this.config.PARTICLE_CONFIG);
                this.fileLoader = new FileLoader(this.modelManager);
                
                // Create default model
                this.modelManager.createDefaultModel();
            }

            setupEventListeners() {
                window.addEventListener('resize', () => this.onWindowResize());
            }

            onWindowResize() {
                const canvas = document.getElementById('webglCanvas');
                const width = canvas.parentElement.clientWidth;
                const height = canvas.parentElement.clientHeight;
                
                this.camera.aspect = width / height;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(width, height);
            }
        }

        // === Game Controller Class ===
        class GameController {
            constructor(threeJSManager, uiElements) {
                this.threeJSManager = threeJSManager;
                this.uiElements = uiElements;
                this.simulationRunning = false;
                this.animationId = null;
                this.lastTime = 0;
                this.frameCount = 0;
                this.fps = 0;
            }

            startSimulation() {
                if (this.simulationRunning) return;
                
                this.simulationRunning = true;
                this.uiElements.simulationStatus.textContent = '運行中';
                
                const density = parseInt(this.uiElements.particleDensitySlider.value);
                const particleCount = this.threeJSManager.particleSystem.createParticles(density);
                this.uiElements.particleCountEl.textContent = particleCount;
                
                this.animate();
            }

            pauseSimulation() {
                this.simulationRunning = false;
                this.uiElements.simulationStatus.textContent = '已暫停';
                
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
            }

            resetSimulation() {
                this.pauseSimulation();
                
                const density = parseInt(this.uiElements.particleDensitySlider.value);
                const particleCount = this.threeJSManager.particleSystem.createParticles(density);
                this.uiElements.particleCountEl.textContent = particleCount;
                this.uiElements.simulationStatus.textContent = '已重置';
                this.uiElements.fpsEl.textContent = '0 FPS';
                
                // Reset rotation sliders
                this.resetRotationSliders();
            }

            resetRotationSliders() {
                this.uiElements.rotationXSlider.value = 0;
                this.uiElements.rotationYSlider.value = 0;
                this.uiElements.rotationZSlider.value = 0;
                this.updateDisplayValues();
            }

            updateDisplayValues() {
                // Update display elements
                this.uiElements.windSpeedValue.textContent = `${this.uiElements.windSpeedSlider.value} km/h`;
                this.uiElements.particleDensityValue.textContent = this.uiElements.particleDensitySlider.value;
                this.uiElements.turbulenceValue.textContent = `${this.uiElements.turbulenceSlider.value}%`;
                this.uiElements.rotationXValue.textContent = `${this.uiElements.rotationXSlider.value}°`;
                this.uiElements.rotationYValue.textContent = `${this.uiElements.rotationYSlider.value}°`;
                this.uiElements.rotationZValue.textContent = `${this.uiElements.rotationZSlider.value}°`;

                // Update model rotation
                this.threeJSManager.modelManager.updateRotation(
                    parseFloat(this.uiElements.rotationXSlider.value),
                    parseFloat(this.uiElements.rotationYSlider.value),
                    parseFloat(this.uiElements.rotationZSlider.value)
                );
            }

            animate(timestamp) {
                if (!this.simulationRunning) return;

                // Update FPS
                this.updateFPS(timestamp);

                // Update particles
                this.threeJSManager.particleSystem.updateParticles();

                // Update controls and render
                this.threeJSManager.controls.update();
                this.threeJSManager.renderer.render(
                    this.threeJSManager.scene, 
                    this.threeJSManager.camera
                );

                this.animationId = requestAnimationFrame((ts) => this.animate(ts));
            }

            updateFPS(timestamp) {
                this.frameCount++;
                if (timestamp >= this.lastTime + 1000) {
                    this.fps = this.frameCount;
                    this.frameCount = 0;
                    this.lastTime = timestamp;
                    this.uiElements.fpsEl.textContent = `${this.fps} FPS`;
                }
            }
        }

        // === Model Management Class ===
        class ModelManager {
            constructor(scene) {
                this.scene = scene;
                this.model = null;
            }

            createDefaultModel() {
                this.removeCurrentModel();
                
                const group = new THREE.Group();
                
                // Create fuselage
                const fuselage = this.createFuselage();
                group.add(fuselage);
                
                // Create wings
                const wings = this.createWings();
                group.add(wings);
                
                // Create tail
                const tail = this.createTail();
                group.add(tail);

                this.model = group;
                this.model.position.y = -2;
                this.scene.add(this.model);
                
                return this.model;
            }

            createFuselage() {
                const geometry = new THREE.CylinderGeometry(0.5, 0.8, 8, 8);
                const material = new THREE.MeshPhongMaterial({ color: 0xff6b6b });
                const fuselage = new THREE.Mesh(geometry, material);
                fuselage.rotation.z = Math.PI / 2;
                return fuselage;
            }

            createWings() {
                const geometry = new THREE.BoxGeometry(12, 0.1, 2);
                const material = new THREE.MeshPhongMaterial({ color: 0x4ecdc4 });
                const wings = new THREE.Mesh(geometry, material);
                wings.position.y = -0.5;
                return wings;
            }

            createTail() {
                const geometry = new THREE.BoxGeometry(0.1, 3, 2);
                const material = new THREE.MeshPhongMaterial({ color: 0xffd166 });
                const tail = new THREE.Mesh(geometry, material);
                tail.position.x = 3.5;
                tail.position.y = 1;
                return tail;
            }

            removeCurrentModel() {
                if (this.model) {
                    this.scene.remove(this.model);
                    this.model = null;
                }
            }

            loadAndScaleModel(newModel) {
                this.removeCurrentModel();
                this.model = newModel;
                this.scaleAndPositionModel();
                this.scene.add(this.model);
            }

            scaleAndPositionModel() {
                const box = new THREE.Box3().setFromObject(this.model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                this.model.position.sub(center);
                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 0) {
                    const scale = 8 / maxDim;
                    this.model.scale.setScalar(scale);
                }
                this.model.position.y = -2;
            }

            updateRotation(x, y, z) {
                if (this.model) {
                    this.model.rotation.x = THREE.MathUtils.degToRad(x);
                    this.model.rotation.y = THREE.MathUtils.degToRad(y);
                    this.model.rotation.z = THREE.MathUtils.degToRad(z);
                }
            }
        }

        // === Particle System Class ===
        class ParticleSystem {
            constructor(scene, config) {
                this.scene = scene;
                this.config = config;
                this.particles = [];
            }

            createParticles(density) {
                this.clearParticles();
                
                for (let i = 0; i < density; i++) {
                    const particle = this.createParticle();
                    this.scene.add(particle);
                    this.particles.push(particle);
                }
                
                return this.particles.length;
            }

            createParticle() {
                const geometry = new THREE.SphereGeometry(this.config.baseSize, 8, 8);
                const material = new THREE.MeshBasicMaterial({
                    color: this.generateRandomColor(),
                    transparent: true,
                    opacity: 0.7
                });
                
                const particle = new THREE.Mesh(geometry, material);
                this.positionParticle(particle);
                
                particle.userData = {
                    speed: parseFloat(windSpeedSlider.value) * this.config.baseSpeed,
                    turbulence: parseFloat(turbulenceSlider.value) * 0.01,
                    originalX: particle.position.x
                };
                
                return particle;
            }

            generateRandomColor() {
                return new THREE.Color(
                    0.3 + Math.random() * 0.4,
                    0.6 + Math.random() * 0.3,
                    0.8 + Math.random() * 0.2
                );
            }

            positionParticle(particle) {
                particle.position.x = 30 + Math.random() * 10;
                particle.position.y = -10 + Math.random() * 20;
                particle.position.z = -10 + Math.random() * 20;
            }

            updateParticles() {
                this.particles.forEach(particle => {
                    this.updateParticlePosition(particle);
                    this.applyTurbulence(particle);
                    this.resetParticleIfNeeded(particle);
                });
            }

            updateParticlePosition(particle) {
                particle.position.x -= particle.userData.speed * 0.1;
            }

            applyTurbulence(particle) {
                if (Math.random() < particle.userData.turbulence) {
                    particle.position.y += (Math.random() - 0.5) * 0.3;
                    particle.position.z += (Math.random() - 0.5) * 0.3;
                }
            }

            resetParticleIfNeeded(particle) {
                if (particle.position.x < -30) {
                    this.positionParticle(particle);
                    particle.userData.originalX = particle.position.x;
                }
            }

            clearParticles() {
                this.particles.forEach(particle => {
                    this.scene.remove(particle);
                });
                this.particles = [];
            }

            getParticleCount() {
                return this.particles.length;
            }
        }

        // === File Loader Class ===
        class FileLoader {
            constructor(modelManager) {
                this.modelManager = modelManager;
            }

            async handleFileUpload(file) {
                return new Promise((resolve, reject) => {
                    const url = URL.createObjectURL(file);
                    const extension = file.name.split('.').pop().toLowerCase();

                    const cleanup = () => URL.revokeObjectURL(url);

                    const loadOptions = {
                        'gltf': () => this.loadGLTF(url, cleanup, resolve, reject),
                        'glb': () => this.loadGLTF(url, cleanup, resolve, reject),
                        'obj': () => this.loadOBJ(url, cleanup, resolve, reject),
                        'stl': () => this.loadSTL(url, cleanup, resolve, reject)
                    };

                    const loadFunction = loadOptions[extension];
                    if (loadFunction) {
                        loadFunction();
                    } else {
                        cleanup();
                        reject(new Error('不支援的檔案格式'));
                    }
                });
            }

            async loadGLTF(url, cleanup, resolve, reject) {
                const loader = new THREE.GLTFLoader();
                loader.load(url, 
                    (gltf) => {
                        cleanup();
                        this.modelManager.loadAndScaleModel(gltf.scene);
                        resolve();
                    }, 
                    undefined, 
                    (error) => {
                        cleanup();
                        reject(error);
                    }
                );
            }

            async loadOBJ(url, cleanup, resolve, reject) {
                const loader = new THREE.OBJLoader();
                loader.load(url, 
                    (obj) => {
                        cleanup();
                        this.modelManager.loadAndScaleModel(obj);
                        resolve();
                    }, 
                    undefined, 
                    (error) => {
                        cleanup();
                        reject(error);
                    }
                );
            }

            async loadSTL(url, cleanup, resolve, reject) {
                const loader = new THREE.STLLoader();
                loader.load(url, 
                    (geometry) => {
                        cleanup();
                        this.processSTLGeometry(geometry);
                        resolve();
                    }, 
                    undefined, 
                    (error) => {
                        cleanup();
                        reject(error);
                    }
                );
            }

            processSTLGeometry(geometry) {
                if (geometry.index === null) {
                    geometry = THREE.BufferGeometryUtils.mergeVertices(geometry);
                }
                const material = new THREE.MeshPhongMaterial({
                    color: 0x4ecdc4,
                    specular: 0x111111,
                    shininess: 100
                });
                const mesh = new THREE.Mesh(geometry, material);
                this.modelManager.loadAndScaleModel(mesh);
            }
        }

        // === 事件綁定 ===
        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // === loadModelIntoScene function (for backward compatibility) ===
        function loadModelIntoScene(model) {
            if (window.threeJSManager && window.threeJSManager.modelManager) {
                window.threeJSManager.modelManager.loadAndScaleModel(model);
            } else {
                console.error('ThreeJSManager not initialized');
            }
        }

        // === Initialize Application ===
        async function initializeApp() {
            try {
                // Initialize ThreeJS manager
                const threeJSManager = new ThreeJSManager(CONFIG);
                const threeComponents = threeJSManager.initialize();
                
                // Store references for backward compatibility
                scene = threeComponents.scene;
                camera = threeComponents.camera;
                renderer = threeComponents.renderer;
                controls = threeComponents.controls;
                
                // Setup UI elements object
                const uiElements = {
                    windSpeedSlider,
                    particleDensitySlider,
                    turbulenceSlider,
                    rotationXSlider,
                    rotationYSlider,
                    rotationZSlider,
                    windSpeedValue,
                    particleDensityValue,
                    turbulenceValue,
                    rotationXValue,
                    rotationYValue,
                    rotationZValue,
                    simulationStatus,
                    particleCountEl,
                    fpsEl,
                    uploadBtn,
                    startBtn,
                    pauseBtn,
                    resetBtn,
                    fileInput
                };

                // Initialize game controller
                const gameController = new GameController(threeJSManager, uiElements);
                
                // Setup event listeners
                setupEventListeners(gameController, threeJSManager);
                
                // Set initial UI state
                gameController.updateDisplayValues();
                uiElements.simulationStatus.textContent = '已暫停';
                
                // Store global references
                window.gameController = gameController;
                window.threeJSManager = threeJSManager;
                
                console.log('Wind tunnel simulator initialized successfully');
                
            } catch (error) {
                console.error('Failed to initialize application:', error);
                showErrorMessage('初始化失敗，請重新整理頁面');
            }
        }

        function setupEventListeners(gameController, threeJSManager) {
            // Slider event listeners
            const sliders = [
                'windSpeedSlider', 'particleDensitySlider', 'turbulenceSlider',
                'rotationXSlider', 'rotationYSlider', 'rotationZSlider'
            ];
            
            sliders.forEach(sliderName => {
                const slider = gameController.uiElements[sliderName];
                if (slider) {
                    slider.addEventListener('input', () => gameController.updateDisplayValues());
                }
            });

            // Button event listeners
            gameController.uiElements.uploadBtn.addEventListener('click', () => {
                gameController.uiElements.fileInput.click();
            });

            gameController.uiElements.startBtn.addEventListener('click', () => {
                gameController.startSimulation();
            });

            gameController.uiElements.pauseBtn.addEventListener('click', () => {
                gameController.pauseSimulation();
            });

            gameController.uiElements.resetBtn.addEventListener('click', () => {
                gameController.resetSimulation();
            });

            // File upload handler
            gameController.uiElements.fileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (file) {
                    try {
                        await threeJSManager.fileLoader.handleFileUpload(file);
                        gameController.resetRotationSliders();
                    } catch (error) {
                        console.error('File upload failed:', error);
                        showErrorMessage('模型載入失敗');
                    }
                }
            });
        }

        function showErrorMessage(message) {
            const statusInfo = document.querySelector('.status-info');
            if (statusInfo) {
                statusInfo.innerHTML = `<div style="color: #ff6b6b; text-align: center;">${message}</div>`;
            }
        }
        async function handleFileUploadFromUrl(url, originalName) {
            return new Promise((resolve, reject) => {
                const extension = url.split('.').pop().toLowerCase();

                if (extension === 'gltf' || extension === 'glb') {
                    const loader = new THREE.GLTFLoader();
                    loader.load(url, (gltf) => {
                        loadModelIntoScene(gltf.scene);
                        resolve();
                    }, undefined, reject);
                } else if (extension === 'obj') {
                    const loader = new THREE.OBJLoader();
                    loader.load(url, (obj) => {
                        loadModelIntoScene(obj);
                        resolve();
                    }, undefined, reject);
                } else if (extension === 'stl') {
                    if (typeof THREE.STLLoader === 'undefined') {
                        reject(new Error('STLLoader 未載入'));
                        return;
                    }
                    const loader = new THREE.STLLoader();
                    loader.load(url, (geometry) => {
                        if (geometry.index === null) {
                            geometry = THREE.BufferGeometryUtils.mergeVertices(geometry);
                        }
                        const material = new THREE.MeshPhongMaterial({
                            color: 0x4ecdc4,
                            specular: 0x111111,
                            shininess: 100
                        });
                        const mesh = new THREE.Mesh(geometry, material);
                        loadModelIntoScene(mesh);
                        resolve();
                    }, undefined, reject);
                } else {
                    reject(new Error('不支援的格式'));
                }
            });
        }
// === 啟動 ===
        document.addEventListener('DOMContentLoaded', () => {
            initializeApp();
        });
    </script>
    <script src="game_error_handler.js"></script>
